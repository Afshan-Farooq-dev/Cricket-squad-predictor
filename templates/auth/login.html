{% extends "base.html" %}
{% block title %}Login — Cricket Squad Selector{% endblock %}
{% block content %}

<div class="d-flex align-items-center justify-content-center py-5" style="min-height: 80vh;">
    <div style="width:100%; max-width:440px;">
        <div class="card-dark" style="padding:2.5rem;">
            <div class="text-center mb-4">
                <i class="fa-solid fa-cricket-bat-ball fa-2x text-accent mb-3"></i>
                <h2 class="fw-bold text-white mb-1">Welcome Back</h2>
                <p class="text-secondary small">Sign in to access your squads and dashboard.</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label text-secondary small">Email Address</label>
                    <input type="email" class="form-control form-control-dark" id="email" name="email" required placeholder="you@example.com">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label text-secondary small">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-dark" id="password" name="password" required placeholder="Your password">
                        <button class="btn" type="button" data-pwd-toggle="password"
                            style="background:#12122A; border:1px solid #2A2A4A; border-left:none; color:#A0A0B0;">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-4 form-check" style="margin-top:0.5rem;">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember" style="background-color:#12122A; border-color:#2A2A4A;">
                    <label class="form-check-label text-secondary small" for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Log In
                </button>

                <div class="text-center text-secondary small">
                    Don't have an account?
                    <a href="{{ url_for('auth.register') }}" class="text-accent text-decoration-none fw-semibold">Sign up</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
