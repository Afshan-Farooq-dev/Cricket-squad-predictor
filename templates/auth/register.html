{% extends "base.html" %}
{% block title %}Register — Cricket Squad Selector{% endblock %}
{% block content %}

<div class="d-flex align-items-center justify-content-center py-5" style="min-height: 85vh;">
    <div style="width:100%; max-width:500px;">
        <div class="card-dark" style="padding:2.5rem;">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-plus fa-2x text-accent mb-3"></i>
                <h2 class="fw-bold text-white mb-1">Create Account</h2>
                <p class="text-secondary small">Join Cricket Squad Selector to save and track your squads.</p>
            </div>

            <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label text-secondary small">Username</label>
                    <input type="text" class="form-control form-control-dark" id="username" name="username" required placeholder="Choose a username">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label text-secondary small">Email Address</label>
                    <input type="email" class="form-control form-control-dark" id="email" name="email" required placeholder="you@example.com">
                </div>

                <div class="mb-2">
                    <label for="password" class="form-label text-secondary small">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-dark" id="password" name="password" required placeholder="Create a strong password">
                        <button class="btn" type="button" data-pwd-toggle="password"
                            style="background:#12122A; border:1px solid #2A2A4A; border-left:none; color:#A0A0B0;">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Password Strength -->
                <div class="mb-3">
                    <div style="background:#2A2A4A; border-radius:4px; height:5px; overflow:hidden;">
                        <div id="strengthBar" style="height:100%; width:0%; border-radius:4px; transition:width 0.3s, background 0.3s;"></div>
                    </div>
                    <span id="strengthText" class="small" style="font-size:0.75rem;"></span>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label text-secondary small">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-dark" id="confirm_password" name="confirm_password" required placeholder="Repeat your password">
                        <button class="btn" type="button" data-pwd-toggle="confirm_password"
                            style="background:#12122A; border:1px solid #2A2A4A; border-left:none; color:#A0A0B0;">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 mb-3">
                    <i class="fa-solid fa-user-plus me-2"></i>Create Account
                </button>

                <div class="text-center text-secondary small">
                    Already have an account?
                    <a href="{{ url_for('auth.login') }}" class="text-accent text-decoration-none fw-semibold">Log in</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
